<!DOCTYPE html>
<html>
<head>
  <title>Full App</title>
</head>
<body>

<h2>Google Login + Save Data</h2>

<button onclick="googleLogin()">Login with Google</button>

<p id="status"></p>

<script type="module">

// Firebase imports
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
import { 
  getAuth, 
  GoogleAuthProvider, 
  signInWithPopup 
} from "https://www.gstatic.com/firebasejs/10.12.0/firebase-auth.js";

import { 
  getFirestore, 
  doc, 
  setDoc 
} from "https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js";

// Config
const firebaseConfig = {
  apiKey: "AIzaSyDrRL7BkyejSooFNx0pD5hBSMsgkfM8MpM",
  authDomain: "database-f0aee.firebaseapp.com",
  projectId: "database-f0aee",
  storageBucket: "database-f0aee.firebasestorage.app",
  messagingSenderId: "1025759093694",
  appId: "1:1025759093694:web:debbf45afc5f0241e88fef"
};

// Init
const app = initializeApp(firebaseConfig);
const auth = getAuth(app);
const db = getFirestore(app);

const provider = new GoogleAuthProvider();

// Login + Save Data
window.googleLogin = async () => {
  try {
    const result = await signInWithPopup(auth, provider);
    const user = result.user;

    // Save user data in Firestore
    await setDoc(doc(db, "users", user.uid), {
      name: user.displayName,
      email: user.email,
      photo: user.photoURL
    });

    document.getElementById("status").innerText =
      "Saved: " + user.email;

  } catch (error) {
    document.getElementById("status").innerText = error.message;
  }
};

</script>

</body>
</html>
